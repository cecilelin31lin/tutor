<!DOCTYPE html>
<html lang="zh-tw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>記憶配對遊戲 Memory Match</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px 60px;
        background: #FFF7E6;
        background-image:
          radial-gradient(circle at 8% 12%, #FFE3A3 0%, transparent 40%),
          radial-gradient(circle at 92% 85%, #BFE6D9 0%, transparent 42%);
        font-family: 'Nunito', 'Trebuchet MS', sans-serif;
        color: #2B3A55;
        min-height: 100vh;
      }
      .wrap { max-width: 680px; margin: 0 auto; }
      h1 {
        font-family: 'Baloo 2', 'Trebuchet MS', sans-serif;
        font-weight: 800;
        text-align: center;
        font-size: 30px;
        color: #E4572E;
        margin: 4px 0 2px;
        letter-spacing: 0.5px;
      }
      .subtitle {
        text-align: center;
        font-size: 15px;
        color: #6b6456;
        margin-bottom: 18px;
      }
      .bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .pill {
        background: #FFFFFF;
        border: 2px solid #FFC93C;
        border-radius: 999px;
        padding: 8px 18px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 15px;
        color: #E4572E;
      }
      button.restart {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 15px;
        background: #4CAF7D;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 10px 22px;
        cursor: pointer;
        box-shadow: 0 3px 0 #33835a;
        transition: transform 0.08s ease;
      }
      button.restart:active { transform: translateY(3px); box-shadow: none; }

      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        perspective: 800px;
      }
      .card {
        aspect-ratio: 1 / 1;
        position: relative;
        cursor: pointer;
      }
      .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
      }
      .card.flipped .card-inner,
      .card.matched .card-inner {
        transform: rotateY(180deg);
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
      }
      .face.back {
        background: linear-gradient(145deg, #FFC93C, #FF9F45);
        border: 3px solid #fff;
        box-shadow: 0 4px 0 #d98a1f;
      }
      .face.back::after {
        content: "☀";
        font-size: 30px;
        color: #fff8e6;
        opacity: 0.85;
      }
      .face.front {
        background: #ffffff;
        border: 3px solid #4FA8D8;
        transform: rotateY(180deg);
        flex-direction: column;
        padding: 6px;
        text-align: center;
      }
      .face.front .emoji { font-size: 40px; line-height: 1; }
      .face.front .word {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #2B3A55;
      }
      .card.matched .face.front {
        background: #E8F9EF;
        border-color: #4CAF7D;
      }
      .card.matched { animation: pop 0.4s ease; }
      @keyframes pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.12); }
        100% { transform: scale(1); }
      }

      .win-screen {
        display: none;
        text-align: center;
        margin-top: 26px;
        background: #fff;
        border: 3px dashed #FF6F59;
        border-radius: 18px;
        padding: 24px 16px;
      }
      .win-screen.show { display: block; }
      .win-screen h2 {
        font-family: 'Baloo 2', sans-serif;
        color: #E4572E;
        font-size: 24px;
        margin: 0 0 8px;
      }
      .win-screen p { margin: 0; font-size: 15px; color: #6b6456; }
      .win-screen .stats {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 12px;
      }
      .win-screen .stat {
        font-size: 14px;
      }
      .win-screen .stat-label {
        color: #999;
      }
      .win-screen .stat-value {
        font-weight: 700;
        color: #E4572E;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🎈 記憶配對遊戲 Memory Match</h1>
      <p class="subtitle">找出正確的單字及中文意思配對！</p>

      <div class="bar">
        <div class="pill">
          🔄 翻牌次數：
          <span id="moves">0</span>
        </div>
        <div class="pill">
          ✅ 配對成功：
          <span id="matches">0</span>
          / 6
        </div>
        <div class="pill">
          ⏱ 遊戲時長：
          <span id="timer">0:00</span>
        </div>
        <button class="restart" onclick="startGame()">重新開始</button>
      </div>

      <div class="board" id="board"></div>

      <div class="win-screen" id="winScreen">
        <h2>🎉 太棒了！全部配對成功！</h2>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">翻牌次數</div>
            <div class="stat-value">
              <span id="finalMoves">0</span>
              次
            </div>
          </div>
          <div class="stat">
            <div class="stat-label">遊戲時長</div>
            <div class="stat-value"><span id="finalTime">0:00</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const pairs = [
  { id: 'pair1', base: 'know', past: '知道' },
  { id: 'pair2', base: 'fight', past: '對抗；打擊' },
  { id: 'pair3', base: 'waste', past: '浪費' },
  { id: 'pair4', base: 'rain', past: '下雨' },
  { id: 'pair5', base: 'visit', past: '拜訪；參觀' },
  { id: 'pair6', base: 'carry', past: '提；攜帶；運送' },
  { id: 'pair7', base: 'plan', past: '規畫；打算' },
  { id: 'pair8', base: 'build', past: '建造' },
];
                  let board = document.getElementById('board');
                  let movesEl = document.getElementById('moves');
                  let matchesEl = document.getElementById('matches');
                  let timerEl = document.getElementById('timer');
                  let winScreen = document.getElementById('winScreen');
                  let finalMoves = document.getElementById('finalMoves');
                  let finalTime = document.getElementById('finalTime');

                  let flipped = [];
                  let lock = false;
                  let moves = 0;
                  let matches = 0;
                  let startTime = null;
                  let timerInterval = null;

                  function shuffle(arr) {
                    for (let i = arr.length - 1; i > 0; i--) {
                      const j = Math.floor(Math.random() * (i + 1));
                      [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    return arr;
                  }

                  function formatTime(seconds) {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return mins + ':' + (secs < 10 ? '0' : '') + secs;
                  }

                  function startTimer() {
                    startTime = Date.now();
                    if (timerInterval) clearInterval(timerInterval);

                    timerInterval = setInterval(() => {
                      const elapsed = Math.floor((Date.now() - startTime) / 1000);
                      timerEl.textContent = formatTime(elapsed);
                    }, 1000);
                  }

                  function stopTimer() {
                    if (timerInterval) clearInterval(timerInterval);
                  }

                  function startGame() {
                    moves = 0;
                    matches = 0;
                    flipped = [];
                    lock = false;
                    movesEl.textContent = 0;
                    matchesEl.textContent = 0;
                    timerEl.textContent = '0:00';
                    winScreen.classList.remove('show');
                    stopTimer();
                    startTimer();

                    let cards = [];
                    pairs.forEach(p => {
                      cards.push({ pairId: p.id, type: 'base', content: p.base });
                      cards.push({ pairId: p.id, type: 'past', content: p.past });
                    });
                    cards = shuffle(cards);

                    board.innerHTML = '';
                    cards.forEach((c, idx) => {
                      const card = document.createElement('div');
                      card.className = 'card';
                      card.dataset.pairId = c.pairId;
                      card.dataset.index = idx;

                      const inner = document.createElement('div');
                      inner.className = 'card-inner';

                      const back = document.createElement('div');
                      back.className = 'face back';

                      const front = document.createElement('div');
                      front.className = 'face front';
                      front.innerHTML = '<div class="word">' + c.content + '</div>';

                      inner.appendChild(back);
                      inner.appendChild(front);
                      card.appendChild(inner);
                      card.addEventListener('click', () => onCardClick(card));
                      board.appendChild(card);
                    });
                  }

                  function onCardClick(card) {
                    if (lock) return;
                    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
                    if (flipped.length === 2) return;

                    card.classList.add('flipped');
                    flipped.push(card);

                    if (flipped.length === 2) {
                      moves++;
                      movesEl.textContent = moves;
                      const [a, b] = flipped;
                      if (a.dataset.pairId === b.dataset.pairId) {
                        lock = true;
                        setTimeout(() => {
                          a.classList.add('matched');
                          b.classList.add('matched');
                          matches++;
                          matchesEl.textContent = matches;
                          flipped = [];
                          lock = false;
                          if (matches === pairs.length) {
                            stopTimer();
                            const elapsed = Math.floor((Date.now() - startTime) / 1000);
                            finalMoves.textContent = moves;
                            finalTime.textContent = formatTime(elapsed);
                            winScreen.classList.add('show');
                          }
                        }, 350);
                      } else {
                        lock = true;
                        setTimeout(() => {
                          a.classList.remove('flipped');
                          b.classList.remove('flipped');
                          flipped = [];
                          lock = false;
                        }, 800);
                      }
                    }
                  }

                  startGame();
    </script>
  </body>
</html>
